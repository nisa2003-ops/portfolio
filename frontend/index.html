<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ===== Primary SEO ===== -->
    <title>Nisadu Nimsitha · Portfolio</title>
    <meta name="description" content="Nisadu Perera — Computer Science student & full-stack developer from Sri Lanka. Explore my projects, skills and experience." />
    <meta name="author" content="Nisadu Nimsitha" />

    <!-- ============================================================
         IMPORTANT: og:image and og:url MUST be full absolute URLs.
         Replace https://your-app.vercel.app below with your real
         Vercel URL (copy it from your Vercel dashboard / browser).
         ============================================================ -->

    <!-- ===== Open Graph (WhatsApp, Facebook, LinkedIn, Discord…) ===== -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nisadu Nimsitha · Portfolio" />
    <meta property="og:url" content="https://your-app.vercel.app/" />
    <meta property="og:title" content="Nisadu Nimsitha · Portfolio" />
    <meta property="og:description" content="Computer Science student & full-stack developer from Sri Lanka. Check out my projects and skills." />
    <meta property="og:image" content="https://your-app.vercel.app/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://your-app.vercel.app/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nisadu Nimsitha — Computer Science student & full-stack developer" />

    <!-- ===== Twitter / X Card ===== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nisadu Nimsitha · Portfolio" />
    <meta name="twitter:description" content="Computer Science student & full-stack developer from Sri Lanka. Check out my projects and skills." />
    <meta name="twitter:image" content="https://your-app.vercel.app/og-image.jpg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
